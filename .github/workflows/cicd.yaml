name: Deploy to Cloud Run

env:
  SERVICE_NAME: servicio-backend-agente-inmobiliaria-micolta
  PROJECT_ID: datapath-ai17-edwar-micolta
  DOCKER_IMAGE_URL: us-central1-docker.pkg.dev/datapath-ai17-edwar-micolta/repositorio-backend-langchain-inmobiliaria/imagen-backend-langchain-inmobiliaria

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dockerize-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Google Cloud Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Restore application secrets
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          printf '%s' "$APP_ENV_FILE" > application/.env
          mkdir -p application/credentials
          printf '%s' "$GOOGLE_SA_JSON" > application/credentials/datapath-ai17-edwar-micolta-fd437b5f82fd.json

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_URL }}:latest -f Dockerfile.prod .
          docker push ${{ env.DOCKER_IMAGE_URL }}:latest

      - name: Deploy to Cloud Run
        run: |
          echo SERVICE_NAME $SERVICE_NAME
          gcloud run deploy $SERVICE_NAME \
            --image ${{ env.DOCKER_IMAGE_URL }}:latest \
            --platform managed \
            --region us-central1 \
            --port=4000 \
            --allow-unauthenticated \
            --service-account=langchain-agente-inmobiliaria@datapath-ai17-edwar-micolta.iam.gserviceaccount.com
            